# Пересборка сайта после выхода нового релиза приложения.
# Раз в час смотрит последние релизы на GitHub (scripts/check-releases.mjs) и сравнивает с прошлой
# проверкой (хранится в кэше Actions). Если версия сменилась — вызывает Deploy Hook Vercel, сайт
# пересобирается, и кнопки «Скачать» ведут на новый файл. В репозиторий ничего не коммитится.
# Нужен секрет VERCEL_DEPLOY_HOOK (см. DEPLOY.md). Запустить вручную: Actions → Releases → Run workflow.
name: Releases

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RELEASES_FILE: .releases-state.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: .releases-state.json
          key: releases-state-${{ github.run_id }}
          restore-keys: releases-state-
      - name: Check releases
        id: check
        run: |
          before=$(cat "$RELEASES_FILE" 2>/dev/null || echo none)
          node scripts/check-releases.mjs
          if [ "$before" = "$(cat "$RELEASES_FILE")" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild site on Vercel
        id: deploy
        if: steps.check.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Нет секрета VERCEL_DEPLOY_HOOK — сайт не пересобран. Как настроить: DEPLOY.md, раздел про Releases."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Vercel: пересборка запущена"
          echo "done=true" >> "$GITHUB_OUTPUT"
      # Состояние сохраняем только после пересборки — иначе следующая проверка попробует снова.
      - name: Save state
        if: steps.deploy.outputs.done == 'true'
        uses: actions/cache/save@v4
        with:
          path: .releases-state.json
          key: releases-state-${{ github.run_id }}
