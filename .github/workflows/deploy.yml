# Сборка и публикация на GitHub Pages (ehroz1.github.io/ehroz.pro).
# Для Vercel / Cloudflare Pages этот workflow не нужен — они собирают сами (см. DEPLOY.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/ehroz-portfolio-showcase-z09hqe]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Когда домен ehroz.pro будет подключён к Pages: SITE_URL=https://ehroz.pro, SITE_BASE=/
          # (Settings → Secrets and variables → Actions → Variables).
          SITE_URL: ${{ vars.SITE_URL || 'https://ehroz1.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/ehroz.pro/' }}
      - name: SEO check
        run: npm run check:seo
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ehroz1.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/ehroz.pro/' }}
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: ${{ vars.PAGES_CNAME }}
